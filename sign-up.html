
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <!-- Main Container -->
    <div class="container d-flex justify-content-center align-items-center min-vh-100">

        <!-- Signup Form -->
        <div class="main-box w-100" style="max-width: 500px;">

            <h1 class="text-center mb-4">Sign Up</h1>

            <form id="signupForm">
                <!-- Name -->
                <div class="form-floating mb-3">
                    <input type="text" class="form-control"
                           id="nameOfUser" placeholder="Your Name" required>
                    <label for="nameOfUser">Name</label>
                </div>

                <!-- Date of Birth -->
                <div class="mb-3">
                    <label for="birthDate" class="form-label">Date of Birth</label>
                    <input type="date" class="form-control" id="birthDate" required>
                </div>

                <!-- Email -->
                <div class="form-floating mb-3">
                    <input type="email" class="form-control"
                           id="email-User" placeholder="name@example.com"
                           autocomplete="email" required>
                    <label for="email-User">Email address</label>
                </div>

                <!-- Password -->
                <div class="form-floating mb-4">
                    <input type="password" class="form-control"
                           id="signupPassword" placeholder="Password"
                           autocomplete="new-password" minlength="6" required>
                    <label for="signupPassword">Password</label>
                </div>

                <p id="signupMessage" role="status" aria-live="polite"></p>

                <!-- Signup Button -->
                <div class="d-grid">
                    <button type="submit" id="signupButton"
                            class="btn btn-primary fw-bold py-3">
                        Create Account
                    </button>
                </div>
            </form>

            <!-- Signin Link -->
            <p class="text-center mt-4">
                Already have an account?
                <a href="./signin.html">Sign in</a>
            </p>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="sign-up.js"></script>

</body>
</html>
