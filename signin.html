
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="w-100 bg-white p-4 rounded shadow"
             style="max-width: 500px;">

            <h1 class="text-center mb-4">Sign In</h1>

            <form id="signinForm">
                <div class="form-floating mb-3">
                    <input type="email" class="form-control"
                           id="signinEmail" placeholder="name@example.com"
                           autocomplete="email" required>
                    <label for="signinEmail">Email address</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" class="form-control"
                           id="signinPassword" placeholder="Password"
                           autocomplete="current-password" required>
                    <label for="signinPassword">Password</label>
                </div>

                <p id="signinMessage" role="status"
                   aria-live="polite"></p>

                <div class="d-grid">
                    <button type="submit" id="signinButton"
                            class="btn btn-primary fw-bold py-3">
                        LOGIN
                    </button>
                </div>
            </form>

            <p class="text-center mt-4">
                Don't have an account?
                <a href="./sign-up.html">Create an account</a>
            </p>
        </div>
    </div>

    <script type="module" src="./signin.js"></script>
</body>
</html>
